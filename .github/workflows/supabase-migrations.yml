# Applies pending Supabase migrations only when migration files change.
# Frontend-only pushes do not run this job.
# Does not reset the database. Does not print secret values.
# Does not run `supabase link` — that command fetches project API keys
# (including service_role) and needs api_gateway_keys_read.

name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Show migration status
        run: supabase migration list --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push pending migrations
        run: supabase db push --yes --project-ref "$SUPABASE_PROJECT_ID" --skip-vault
