# Applies pending Supabase migrations only when migration files change.
# Frontend-only pushes do not run this job.
# Does not reset the database. Does not print secret values.
# Connects with SUPABASE_DB_URL. Does not run `supabase link`.

name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Show migration status
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Push pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes --skip-vault
